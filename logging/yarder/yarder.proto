syntax = "proto3";

package yarder;

option go_package = "github.com/kellegous/glue/logging/yarder";

import "google/protobuf/empty.proto";

service Yarder { rpc Log(LogReq) returns (google.protobuf.Empty); }

message LogReq {
  string app = 1;
  bytes writer_key = 2;
  uint64 writer_seq = 3;
  bytes data = 4;
}
